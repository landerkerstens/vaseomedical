<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News — Vaseo Medical</title>
  <meta name="description" content="Latest news and announcements from Vaseo Medical: portfolio updates, training programmes and company milestones in therapeutic endoscopy and ablation." />
  <link rel="canonical" href="https://vaseomedical.com/news.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vaseo Medical" />
  <meta property="og:url" content="https://vaseomedical.com/news.html" />
  <meta property="og:title" content="News — Vaseo Medical" />
  <meta property="og:description" content="Portfolio updates, training programmes and company milestones from Vaseo Medical." />
  <meta property="og:image" content="https://vaseomedical.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- The intro veil plays once per browser session. Deciding that here, before
       the first paint, keeps a repeat view from flashing the mark again. -->
  <script>
    try {
      if (sessionStorage.getItem("vaseo-intro")) document.documentElement.classList.add("intro-done");
      else sessionStorage.setItem("vaseo-intro", "1");
    } catch (e) { /* storage blocked (private mode): just play it */ }
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== INTRO VEIL ===== -->
  <!-- Written here rather than in a component so it paints with the first
       frame; behaviour and the once-per-session guard live in styles.css
       and the inline script above. -->
  <div class="intro" aria-hidden="true">
    <img class="intro__mark" src="favicon.svg" alt="" />
  </div>

  <!-- ===== NAV (component) ===== -->
  <site-header></site-header>

  <main id="main" tabindex="-1">

  <!-- ===== NEWS ===== -->
  <section class="section news" id="news">
    <div class="section__head">
      <p class="eyebrow">News</p>
      <h2>Updates from Vaseo Medical.</h2>
      <p class="section__sub">Portfolio additions, training programmes and company milestones. Product availability and indications are subject to Australian regulatory registration.</p>
    </div>
    <!-- dated entries rendered by the component -->
    <news-list></news-list>
  </section>

  </main>

  <!-- ===== FOOTER (component) ===== -->
  <site-footer></site-footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
